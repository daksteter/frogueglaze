services:
  # =============================================================================
  # MAIN APPLICATION
  # =============================================================================

  openglaze:
    build: .
    container_name: openglaze
    ports:
      - "8768:8768"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
    volumes:
      # SQLite database (DATABASE_PATH=/data/glaze.db) and uploaded photos
      - openglaze_data:/data
      - openglaze_uploads:/app/frontend/uploads
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8768/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # REVERSE PROXY (Production)
  # =============================================================================

  nginx:
    image: nginx:alpine
    container_name: openglaze-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - openglaze
    restart: unless-stopped
    profiles:
      - prod

volumes:
  openglaze_data:
  openglaze_uploads:

networks:
  default:
    name: openglaze-network
